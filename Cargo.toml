[package]
name = "envoy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "envoy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
hostname = "0.4"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }